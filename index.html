<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b251f" />
    <title>ブラウザで遊べる将棋（対CPU）</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="game-container">
      <header class="game-header">
        <div class="brand">
          <span class="brand-mark">対 CPU</span>
          <h1>将棋</h1>
        </div>
        <div id="message" role="status" aria-live="polite">あなたの番です。</div>
        <div
          class="cpu-evaluation"
          id="cpu-evaluation"
          role="img"
          aria-label="CPUの形勢判断：互角"
          title="CPUの形勢判断：互角"
        >
          <span class="cpu-evaluation-label">CPU</span>
          <span id="cpu-evaluation-emoji" aria-hidden="true">😐</span>
        </div>
        <div id="controls">
          <button
            class="control"
            id="flip-button"
            type="button"
            aria-pressed="false"
            aria-label="盤面を反転して、あなたを上にする"
            title="盤面を反転して、あなたを上にする"
          >
            反転
          </button>
          <button class="control" id="copy-kif-button" type="button" hidden>
            KIFをコピー
          </button>
          <button class="control" id="restart-button" type="button">最初から</button>
        </div>
      </header>
      <main id="play-area" aria-label="将棋盤と持ち駒">
        <section class="hand" id="cpu-hand" aria-labelledby="cpu-hand-title">
          <h2 id="cpu-hand-title"><span id="cpu-side-label">後手</span>の<br />持ち駒</h2>
          <div class="pieces" id="cpu-pieces"></div>
        </section>
        <div id="board" role="grid" aria-label="将棋盤"></div>
        <section class="hand" id="player-hand" aria-labelledby="player-hand-title">
          <h2 id="player-hand-title"><span id="player-side-label">先手</span>の<br />持ち駒</h2>
          <div class="pieces" id="player-pieces"></div>
        </section>
      </main>
    </div>

    <script src="engine.js"></script>
    <script src="kif.js"></script>
    <script src="app.js"></script>
  </body>
</html>
